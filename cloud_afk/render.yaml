services:
  - type: web
    name: discord-247-afk
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev 2>/dev/null || true
    startCommand: node voice_daemon.mjs
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: PORT
        value: "10000"
      - key: WORKER_URL
        value: "https://discord-afk-keepalive.anas05123.workers.dev"
